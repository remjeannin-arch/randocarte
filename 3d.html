<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RandoCarte — Vue 3D</title>
<meta name="theme-color" content="#1a1d21">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d21;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e8eaed; }
  #map3d { position: absolute; inset: 0; }
  #bar { position: absolute; top: calc(var(--safe-top) + 8px); left: 8px; right: 8px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: rgba(26,29,33,.92);
    border-radius: 12px; padding: 7px 9px; backdrop-filter: blur(6px); }
  #bar a, #bar button { border: none; border-radius: 9px; padding: 8px 11px; font-size: 14px;
    background: #2c313a; color: #e8eaed; cursor: pointer; text-decoration: none; font-weight: 600; }
  #bar #btn-play { background: #4dabf7; color: #fff; }
  #tname { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #msg { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); z-index: 20;
    background: rgba(17,19,22,.95); padding: 16px 20px; border-radius: 12px; font-size: 14px;
    max-width: 82vw; text-align: center; line-height: 1.5; display: none; }
  .maplibregl-ctrl-attrib { background: rgba(26,29,33,.7) !important; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { color: #999 !important; font-size: 9px !important; }
  .maplibregl-ctrl-bottom-right { margin-bottom: 142px; }

  /* profil altimétrique */
  #prof3d-wrap { position: absolute; left: 8px; right: 8px; bottom: calc(var(--safe-bottom) + 8px);
    z-index: 10; background: rgba(26,29,33,.92); border-radius: 12px; padding: 6px 8px 2px; display: none; }
  #prof3d-wrap.on { display: block; }
  #prof3d { width: 100%; height: 118px; display: block; touch-action: none; cursor: crosshair; }
  #prof3d-close { position: absolute; top: 2px; right: 6px; background: none; border: none;
    color: #9aa0a6; font-size: 16px; z-index: 1; cursor: pointer; }
</style>
</head>
<body>
<div id="map3d"></div>
<div id="bar">
  <a href="./" title="Retour à la carte">‹</a>
  <span id="tname">Vue 3D</span>
  <button id="btn-loc" title="Ma position">🧭</button>
  <button id="btn-prof" title="Profil altimétrique">📈</button>
  <button id="btn-fond" title="Changer de fond">🛰️</button>
  <button id="btn-fit" title="Recentrer">⤢</button>
  <button id="btn-play" title="Survoler le parcours">▶</button>
</div>
<div id="prof3d-wrap"><button id="prof3d-close">✕</button><canvas id="prof3d"></canvas></div>
<div id="msg"></div>
<script src="vendor/maplibre-gl.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const showMsg = (html) => { const m = $("msg"); m.innerHTML = html; m.style.display = "block"; };

if (!navigator.onLine) {
  showMsg("La vue 3D nécessite une connexion internet (terrain en relief chargé en direct).<br><br><a href='./' style='color:#4dabf7'>‹ Retour à la carte</a>");
}

/* ---- lecture de la trace dans la base de l'app ---- */
function loadTrack() {
  return new Promise((resolve) => {
    const req = indexedDB.open("randocarte", 1);
    req.onerror = () => resolve(null);
    req.onsuccess = () => {
      try {
        const tx = req.result.transaction("tracks", "readonly");
        const all = tx.objectStore("tracks").getAll();
        all.onsuccess = () => {
          const tracks = all.result || [];
          const wanted = decodeURIComponent(location.hash.slice(1)) ||
            localStorage.getItem("rc.active") || "";
          resolve(tracks.find(t => t.id === wanted) || tracks[0] || null);
        };
        all.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    };
  });
}

/* ---- géométrie ---- */
const R = 6371000;
function haversine(a, b) {
  const dLat = (b[0] - a[0]) * Math.PI / 180, dLon = (b[1] - a[1]) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function bearing(a, b) {
  const f1 = a[0] * Math.PI / 180, f2 = b[0] * Math.PI / 180, dl = (b[1] - a[1]) * Math.PI / 180;
  const y = Math.sin(dl) * Math.cos(f2);
  const x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

const FONDS = [
  { icon: "🛰️", name: "Satellite", tiles: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", attr: "© Esri, Maxar" },
  { icon: "🗺️", name: "Plan IGN", tiles: "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image%2Fpng&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}", attr: "© IGN Géoplateforme" },
];
let fondIdx = 0;

(async () => {
  const track = await loadTrack();
  let center = [2.5, 45.5], zoom = 6;
  const saved = JSON.parse(localStorage.getItem("rc.view") || "null");
  if (saved) { center = [saved.c[1], saved.c[0]]; zoom = Math.min(saved.z, 13); }

  let pts = null, cum = null, dist = 0;
  if (track && track.pts && track.pts.length > 1) {
    pts = track.pts;
    cum = [0];
    for (let i = 1; i < pts.length; i++) { dist += haversine(pts[i - 1], pts[i]); cum.push(dist); }
    $("tname").textContent = track.name;
    center = [pts[0][1], pts[0][0]]; zoom = 12;
  } else {
    $("tname").textContent = "Vue 3D (aucune trace)";
  }

  let map;
  try {
    map = new maplibregl.Map({
      container: "map3d",
      center, zoom, pitch: 60, bearing: -25, maxPitch: 78,
      attributionControl: { compact: true },
      style: {
        version: 8,
        sources: {
          fond: { type: "raster", tiles: [FONDS[0].tiles], tileSize: 256, maxzoom: 18, attribution: FONDS[0].attr + " · terrain © Mapzen/AWS" },
          fond2: { type: "raster", tiles: [FONDS[1].tiles], tileSize: 256, maxzoom: 18 },
          dem: { type: "raster-dem", tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"], encoding: "terrarium", tileSize: 256, maxzoom: 13 },
        },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#0d0f11" } },
          { id: "fond", type: "raster", source: "fond" },
          { id: "fond2", type: "raster", source: "fond2", layout: { visibility: "none" } },
        ],
        terrain: { source: "dem", exaggeration: 1.3 },
      },
    });
  } catch (e) {
    showMsg("La 3D (WebGL) n'est pas disponible sur cet appareil.<br><br><a href='./' style='color:#4dabf7'>‹ Retour à la carte</a>");
    return;
  }
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
  map.touchPitch.enable();
  try { map.setSky({ "sky-color": "#7db6e8", "horizon-color": "#dfeaf5", "sky-horizon-blend": .6, "horizon-fog-blend": .6, "fog-color": "#dfeaf5", "fog-ground-blend": .85 }); } catch (e) {}

  const fitAll = () => {
    if (!pts) return;
    let w = Infinity, s = Infinity, e = -Infinity, n = -Infinity;
    for (const p of pts) { w = Math.min(w, p[1]); e = Math.max(e, p[1]); s = Math.min(s, p[0]); n = Math.max(n, p[0]); }
    map.fitBounds([[w, s], [e, n]],
      { padding: { top: 90, left: 45, right: 45, bottom: 165 }, pitch: 58, bearing: -25, duration: 1600 });
  };

  map.on("load", () => {
    const addPos = () => {
      map.addSource("pos", { type: "geojson", data: EMPTY });
      map.addLayer({ id: "pos", type: "circle", source: "pos",
        paint: { "circle-radius": 7, "circle-color": "#2b7de9", "circle-stroke-color": "#fff", "circle-stroke-width": 3 } });
    };
    if (!pts) { addPos(); return; }
    map.addSource("trace", { type: "geojson", data: {
      type: "Feature", geometry: { type: "LineString", coordinates: pts.map(p => [p[1], p[0]]) } } });
    /* couche invisible et large : zone de toucher confortable sur la trace */
    map.addLayer({ id: "trace-hit", type: "line", source: "trace",
      paint: { "line-color": "#fff", "line-width": 28, "line-opacity": 0.01 } });
    map.addLayer({ id: "trace-halo", type: "line", source: "trace",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#fff", "line-width": 7, "line-opacity": .7 } });
    map.addLayer({ id: "trace", type: "line", source: "trace",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": track.color || "#ff4d6d", "line-width": 4 } });
    map.addSource("ends", { type: "geojson", data: { type: "FeatureCollection", features: [
      { type: "Feature", properties: { c: "#51cf66" }, geometry: { type: "Point", coordinates: [pts[0][1], pts[0][0]] } },
      { type: "Feature", properties: { c: "#ff6b6b" }, geometry: { type: "Point", coordinates: [pts[pts.length - 1][1], pts[pts.length - 1][0]] } },
    ] } });
    map.addLayer({ id: "ends", type: "circle", source: "ends",
      paint: { "circle-radius": 7, "circle-color": ["get", "c"], "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
    map.addSource("cursor", { type: "geojson", data: EMPTY });
    map.addLayer({ id: "cursor", type: "circle", source: "cursor",
      paint: { "circle-radius": 6, "circle-color": "#1a1d21", "circle-stroke-color": "#fff", "circle-stroke-width": 3 } });
    addPos();
    /* toucher la trace en 3D → curseur sur le profil */
    map.on("click", "trace-hit", (e) => {
      if (!$("prof3d-wrap").classList.contains("on")) toggleProf(true);
      setCursor(nearestIdx(e.lngLat.lat, e.lngLat.lng), false);
    });
    fitAll();
  });

  $("btn-fond").addEventListener("click", () => {
    fondIdx = 1 - fondIdx;
    map.setLayoutProperty("fond", "visibility", fondIdx === 0 ? "visible" : "none");
    map.setLayoutProperty("fond2", "visibility", fondIdx === 1 ? "visible" : "none");
    $("btn-fond").textContent = FONDS[1 - fondIdx].icon;
  });
  $("btn-fit").addEventListener("click", () => { stopFly(); fitAll(); });

  /* ---- survol animé du parcours ---- */
  let playing = false, dcur = 0, raf = null;
  const posAt = (d) => {
    let i = 1;
    while (i < cum.length - 1 && cum[i] < d) i++;
    const a = pts[i - 1], b = pts[i], seg = cum[i] - cum[i - 1] || 1;
    const f = Math.min(1, Math.max(0, (d - cum[i - 1]) / seg));
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  };
  let smoothedBearing = null;
  const stepFly = () => {
    if (!playing) return;
    dcur += Math.max(2.2, dist / 3200); // parcours complet en ≈ 55 s
    if (dcur >= dist) { stopFly(); fitAll(); return; }
    const p = posAt(dcur), ahead = posAt(Math.min(dist, dcur + 260));
    let brg = bearing(p, ahead);
    if (smoothedBearing == null) smoothedBearing = brg;
    else {
      let diff = ((brg - smoothedBearing + 540) % 360) - 180;
      smoothedBearing = (smoothedBearing + diff * 0.04 + 360) % 360;
    }
    map.jumpTo({ center: [p[1], p[0]], bearing: smoothedBearing, pitch: 64, zoom: 14.4 });
    raf = requestAnimationFrame(stepFly);
  };
  const stopFly = () => {
    playing = false;
    if (raf) cancelAnimationFrame(raf);
    $("btn-play").textContent = "▶";
  };
  $("btn-play").addEventListener("click", () => {
    if (!pts) return;
    if (playing) { stopFly(); return; }
    playing = true;
    smoothedBearing = null;
    if (dcur >= dist) dcur = 0;
    $("btn-play").textContent = "⏸";
    stepFly();
  });
  map.on("mousedown", stopFly);
  map.on("touchstart", stopFly);

  /* ================= Profil altimétrique + curseurs synchronisés ================= */
  const EMPTY = { type: "FeatureCollection", features: [] };
  const hasEle = !!pts && pts.some(p => p[2] != null);
  let profCursor = -1, posIdx = -1;
  const nearestIdx = (lat, lon) => {
    let best = Infinity, idx = 0;
    for (let i = 0; i < pts.length; i++) {
      const d = haversine([lat, lon], pts[i]);
      if (d < best) { best = d; idx = i; }
    }
    return idx;
  };
  const eleAt = (i) => {
    if (pts[i] && pts[i][2] != null) return pts[i][2];
    for (let d = 1; d < pts.length; d++) {
      if (pts[i - d] && pts[i - d][2] != null) return pts[i - d][2];
      if (pts[i + d] && pts[i + d][2] != null) return pts[i + d][2];
    }
    return null;
  };
  const PROF = { L: 38, R: 10, T: 8, B: 16 };
  const niceStep = (range, target, steps) => {
    for (const s of steps) if (range / s <= target) return s;
    return steps[steps.length - 1];
  };
  const cv3 = $("prof3d");
  function drawProf() {
    if (!hasEle || !$("prof3d-wrap").classList.contains("on")) return;
    const dpr = window.devicePixelRatio || 1;
    const cw = cv3.clientWidth || 320, ch = cv3.clientHeight || 118;
    cv3.width = cw * dpr; cv3.height = ch * dpr;
    const ctx = cv3.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    const eles = pts.map(p => p[2]).filter(e => e != null);
    let mn = eles.reduce((a, b) => Math.min(a, b), Infinity);
    let mx = eles.reduce((a, b) => Math.max(a, b), -Infinity);
    if (mx - mn < 20) { const c = (mx + mn) / 2; mn = c - 10; mx = c + 10; }
    const span = mx - mn;
    const x0 = PROF.L, x1 = cw - PROF.R, y0 = PROF.T, y1 = ch - PROF.B;
    const X = (d) => x0 + (d / dist) * (x1 - x0);
    const Y = (e) => y1 - ((e - mn) / span) * (y1 - y0);
    ctx.font = "10px -apple-system, sans-serif";
    ctx.lineWidth = 1;
    const aStep = niceStep(span, 5, [10, 20, 50, 100, 200, 500, 1000, 2000]);
    ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.fillStyle = "#9aa0a6";
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let a = Math.ceil(mn / aStep) * aStep; a <= mx; a += aStep) {
      ctx.beginPath(); ctx.moveTo(x0, Y(a)); ctx.lineTo(x1, Y(a)); ctx.stroke();
      ctx.fillText(a, x0 - 4, Y(a));
    }
    const kmTotal = dist / 1000;
    const kStep = niceStep(kmTotal, 7, [0.2, 0.5, 1, 2, 5, 10, 20, 50]);
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let k = kStep; k < kmTotal; k += kStep) {
      ctx.beginPath(); ctx.moveTo(X(k * 1000), y0); ctx.lineTo(X(k * 1000), y1); ctx.stroke();
      ctx.fillText(String(Math.round(k * 10) / 10).replace(".", ","), X(k * 1000), y1 + 3);
    }
    ctx.textAlign = "left";
    ctx.fillText("km", x1 - 16, y1 + 3);
    ctx.beginPath();
    let started = false, firstX = x0;
    for (let i = 0; i < pts.length; i++) {
      if (pts[i][2] == null) continue;
      const x = X(cum[i]), y = Y(pts[i][2]);
      if (!started) firstX = x;
      started ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      started = true;
    }
    const color = (track && track.color) || "#ff4d6d";
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    ctx.lineTo(x1, y1); ctx.lineTo(firstX, y1); ctx.closePath();
    ctx.fillStyle = color + "2e"; ctx.fill();
    /* position GPS en temps réel */
    if (posIdx >= 0) {
      const e = eleAt(posIdx);
      if (e != null) {
        ctx.beginPath(); ctx.arc(X(cum[posIdx]), Y(e), 5, 0, 7);
        ctx.fillStyle = "#2b7de9"; ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    /* curseur */
    if (profCursor >= 0 && profCursor < pts.length) {
      const i = profCursor, e = eleAt(i), x = X(cum[i]);
      ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      ctx.setLineDash([]);
      if (e != null) { ctx.beginPath(); ctx.arc(x, Y(e), 4, 0, 7); ctx.fillStyle = "#fff"; ctx.fill(); }
      const dp = track && track.cumDplus && track.cumDplus.length === pts.length
        ? ` · D+ ${track.cumDplus[i]} m` : "";
      const label = `${(cum[i] / 1000).toFixed(1).replace(".", ",")} km · ${e != null ? Math.round(e) + " m" : "?"}${dp}`;
      ctx.font = "11px -apple-system, sans-serif";
      const w = ctx.measureText(label).width + 10;
      const lx = Math.min(Math.max(x - w / 2, x0), x1 - w);
      ctx.fillStyle = "rgba(15,17,20,.92)";
      ctx.fillRect(lx, 0, w, 15);
      ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(label, lx + 5, 8);
    }
  }
  function toggleProf(on) {
    $("prof3d-wrap").classList.toggle("on", on);
    if (on) drawProf();
    else {
      profCursor = -1;
      const s = map.getSource && map.getSource("cursor");
      if (s) s.setData(EMPTY);
    }
  }
  const setCursor = (i, pan = true) => {
    profCursor = i;
    const p = pts[i];
    const s = map.getSource("cursor");
    if (s) s.setData({ type: "Feature", geometry: { type: "Point", coordinates: [p[1], p[0]] } });
    if (pan && !map.getBounds().contains([p[1], p[0]])) map.easeTo({ center: [p[1], p[0]], duration: 500 });
    drawProf();
  };
  let profDrag = false;
  const profPoint = (ev) => {
    if (!pts || dist <= 0) return;
    const r = cv3.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left - PROF.L) / (r.width - PROF.L - PROF.R)));
    const d = frac * dist;
    let i = 0;
    while (i < cum.length - 1 && cum[i] < d) i++;
    setCursor(i);
  };
  cv3.addEventListener("pointerdown", (e) => { profDrag = true; profPoint(e); e.preventDefault(); });
  window.addEventListener("pointermove", (e) => { if (profDrag) profPoint(e); });
  window.addEventListener("pointerup", () => { profDrag = false; });
  $("prof3d-close").addEventListener("click", () => toggleProf(false));
  $("btn-prof").addEventListener("click", () => toggleProf(!$("prof3d-wrap").classList.contains("on")));
  window.addEventListener("resize", () => drawProf());
  if (hasEle) toggleProf(true); else $("btn-prof").style.display = "none";

  /* ================= Ma position ================= */
  let watchId = null;
  $("btn-loc").addEventListener("click", () => {
    if (!("geolocation" in navigator)) return;
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      $("btn-loc").style.background = "";
      const s = map.getSource("pos");
      if (s) s.setData(EMPTY);
      posIdx = -1;
      drawProf();
      return;
    }
    $("btn-loc").style.background = "#4dabf7";
    watchId = navigator.geolocation.watchPosition((g) => {
      const s = map.getSource("pos");
      if (s) s.setData({ type: "Feature",
        geometry: { type: "Point", coordinates: [g.coords.longitude, g.coords.latitude] } });
      if (pts) { posIdx = nearestIdx(g.coords.latitude, g.coords.longitude); drawProf(); }
    }, () => { $("btn-loc").style.background = ""; watchId = null; },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  });
})();
</script>
</body>
</html>
